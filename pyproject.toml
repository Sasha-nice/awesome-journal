[project]
name = "awesome-journal"
version = "0.1.0"
description = "Personal journal Telegram bot + MCP server"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.20",
    "asyncpg>=0.30",
    "pydantic>=2.11",
    "google-genai>=1.14",
    "mcp[cli]>=1.27",
    "alembic>=1.15",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.11",
    "mypy>=1.15",
]

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
